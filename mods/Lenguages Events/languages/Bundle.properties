gre.desc = The tension has finally reached its boiling point. The Kingdom of Greece has collapsed into a brutal civil war. The communist guerrillas of the Democratic Army of Greece (DSE) have launched a massive, coordinated offensive...
world.desc = It is 1947. World War II has ended, but a new global standoff has begun. The United States and the Soviet Union now split the world into two rival blocs. From the divided borders of Germany and Korea to the bloody civil war in China, tensions are at a breaking point. In New York, the United Nations serves as the last arena for world diplomacy. Choose your allegiance—the nuclear age has arrived.
b.desc = On January 1, 1947, the United States and the United Kingdom officially merged their zones of occupation in post-war Germany into a single economic and administrative unit known as the Bizone. This move aims to streamline reconstruction efforts and revive the devastated German economy. However, the Soviet Union views this as a direct breach of wartime agreements and a step toward permanently partitioning the country. This integration marks the first definitive lines of the Cold War division in Europe.
p.desc = In January 1947, Italian Prime Minister Alcide De Gasperi traveled to Washington. Facing starvation and inflation, Italy secured a vital 100-million-dollar loan and grain shipments from the US. 
In exchange for this economic lifeline, Washington demands the exclusion of Communists and Socialists from the Italian government, sealing Italy's alignment with the Western bloc.
paris.desc = The victorious Allies have signed the Peace Treaties in Paris with Italy, Romania, Hungary, Bulgaria, and Finland. Italy officially cedes Istria to Yugoslavia, Tenda to France, and all its African colonies (Libya, Eritrea, Somalia) are placed under Allied military administration.
india.desc = Prime Minister Clement Attlee has announced to Parliament that the British Raj is coming to an end. The British Government declares its definitive intention to transfer power into Indian hands no later than June 1948, triggering immense political maneuvering and tension in the subcontinent.
dunkirk.desc =  France and the United Kingdom have signed a mutual defense alliance in Dunkirk. Officially designed to contain any future German aggression, the treaty lays the groundwork for the future military alliance of the Western European powers against the growing Soviet bloc.
auriol.desc = On January 16, 1947, Vincent Auriol is elected as the first President of the newly established French Fourth Republic. With his inauguration, France aims to stabilize its domestic politics after the chaos of World War II. This new government faces the massive challenge of reasserting centralized control over its vast colonial federations in Africa (AOF and AEF) and navigating the escalating crisis in French Indochina.
pole.desc = On January 19, 1947, the Soviet-backed Democratic Bloc, dominated by the Polish Workers' Party, wins the legislative elections amidst widespread political oppression and fraudulent vote counting. This controversial victory officially marks the end of democratic pluralism in Poland, legally cementing the country's status as a communist satellite state firmly under the control of the Soviet Union.