gre.desc = The tension has finally reached its boiling point. The Kingdom of Greece has collapsed into a brutal civil war. The communist guerrillas of the Democratic Army of Greece (DSE) have launched a massive, coordinated offensive...
world.desc = It is 1947. World War II has ended, but a new global standoff has begun. The United States and the Soviet Union now split the world into two rival blocs. From the divided borders of Germany and Korea to the bloody civil war in China, tensions are at a breaking point. In New York, the United Nations serves as the last arena for world diplomacy. Choose your allegiance—the nuclear age has arrived.
b.desc = On January 1, 1947, the United States and the United Kingdom officially merged their zones of occupation in post-war Germany into a single economic and administrative unit known as the Bizone. This move aims to streamline reconstruction efforts and revive the devastated German economy. However, the Soviet Union views this as a direct breach of wartime agreements and a step toward permanently partitioning the country. This integration marks the first definitive lines of the Cold War division in Europe.