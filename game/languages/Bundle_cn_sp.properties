gre.desc = 紧张局势终于到达了顶点。希腊王国已陷入残酷的内战。希腊民主军（DSE）的共产主义游击队在北部山区发动了大规模的协同攻势，其武器弹药大量来自南斯拉夫、阿尔巴尼亚和保加利亚的走私补给。国库空虚，民众忍饥挨饿，城市遭到围困，已再无外交斡旋的余地。为希腊未来而战的战斗，就此打响。
