fishy_business.d = 鱼群消失了！曾经生机盎然的海域，如今只剩下空空的渔网和饥肠辘辘的渔民。物价暴涨了{1}%。难道是巨大的海怪把它们全都吞掉了？还是它们终于识破了我们的渔网？没有人知道答案，但有一点是肯定的——必须查清楚到底发生了什么！
StormIsApproaching = 风暴将至
StormDesc1 = 欧洲屏住了呼吸。奥地利已不复存在，被并入第三帝国。慕尼黑协定及随后的占领之后，捷克斯洛伐克也已消失，被德国、匈牙利和波兰瓜分殆尽。阿尔巴尼亚在短短数日内便沦陷于意大利之手，而埃塞俄比亚自1936年起就已是意大利的领土。
StormDesc2 = 在远东，日本与中国自1937年起便陷入公开战争。但泽仍是一座自由市——可这还能维持多久？欧洲各国的政府都在问着同一个问题：下一个会是哪里？和平如今只剩下形式，人人遵守，却无人相信。
