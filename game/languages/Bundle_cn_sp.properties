Stability1 = 地区稳定度的范围为1%到100%，表示你对该地区的控制程度。
Stability2 = 它受到本文明人口占比、驻军情况、疾病、腐败、革命风险、幸福度以及是否被占领等因素的影响。
Stability3 = 若要提升稳定度，可在地区决议界面使用「同化法令」，以增加该地区中本文明人口的比例。
Rebels1 = 若民众不满、地区稳定度较低，或有其他文明在背后支持，革命风险便会上升。
Rebels2 = 当地区革命风险较高时，可能会出现叛乱国家。
HappinessTaxes1 = 幸福的民众更愿意缴纳税款。
Happiness1 = 当幸福度极低时，地区稳定度会下降，从而导致叛乱风险上升。
Festival1 = 在地区举办节庆将提升其幸福度。
Taxes1 = 每种政府类型都有各自的税收阈值。
Taxes2 = 若税率超过该阈值，所有地区的幸福度将根据超出的幅度而下降。
Taxes3 = 若税率保持在该阈值以下，幸福度也将以相同的方式提升。
Supplies1 = 若地区未获得补给，其防御力将下降，使敌人更容易将其占领。
Development1 = 每个地区都有一个发展水平，范围为0.01到2.0。发展水平越高，该地区的总体产出与价值也越高。
Development2 = 地区的发展水平最高只能达到其所有者的科技等级。
MineBDesc = 在该地区建造矿山以开采铁矿。仅限山地与丘陵地区。
UraniumMineBDesc = 在该地区建造铀矿以开采铀。仅限拥有铀矿床的地区，且需要先进科技。
