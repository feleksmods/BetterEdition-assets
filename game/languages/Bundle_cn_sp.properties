WelcomeToTheTutorial = 欢迎来到本教程!

t0 = 文明时代II是一个简单易学但难以掌握的回合制大战略游戏。 
t1 = 你的目标是使用军事战术和狡猾的外交手段来统一世界， 或征服世界。 
t2 = 世界会流血牺牲还是屈服于你？选择权在你手中。 

HoverAnElementToGetMoreInformations = 悬停一个部分获取更多信息

t3 = 指令每轮之前提交。 
t4 = 您可以在每个回合中提交的指令数量受该回合的移动点限制。 
t5 = 在提交命令之后， 文明依次执行动作， 每个回合的开始都是随机的。 
t6 = 透明省份是中立的。 有颜色的省份属于其他文明。 有条纹的省份被占领。 
t6a = 在所有文明省份中， 人口最多的省份都有城市。 这些省是关键省份。 

cw0 = 你的战争和战争的比分
cw1 = 大多数外交指令需要外交点数

CapitalOfYourCivilization = 你文明的首都
