refofstol = Stolypin's Agrarian Reform
refofstoltext = The peasant community is hindering the development of the countryside. Stolypin proposes encouraging the exit from the community and the creation of strong farms. This will increase crop yields, but it will also cause discontent among traditionalists and the poor, who will lose their land. The nobility is also concerned about the rise of wealthy kulaks.
refofstolvar = Support the reform
refofstolvar1 = Close the program
NicholasII = Nicholai II
DFederation = Supporters of agrarianism give quite definite answers to this. Born from the desire of peasants and small landowners to preserve their way of life, agrarianism strives to prevent people from being mercilessly crushed by the wheel of progress or, conversely, sucked into the swamp of backwardness. For them, the land is the guarantee of independence and support, a living thread that stretches from great-grandfather to grandson. It becomes a reason to persevere to the end, gives shape to existence, and washes the soul in troubled times. Therefore, any force that wishes to stifle or distort this beauty deserves a decisive response. The sprawling underbelly of the cities and everything associated with them are pests that must be kept in check and forced to dance to the tune of the peasantry. And if the villagers demand subsidies or prohibitive tariffs, the city dwellers must submit, or they will be swept away.
