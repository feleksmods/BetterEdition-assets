National Socialism = After the October Revolution brought communism to the world stage, a counter-reaction began to form in fear of the Red menace. In Italy, this reaction manifested itself as fascism. In Germany, as National Socialism. With the fall of Bolshevism, National Socialism became the ideology determining the fate of Europe. Emerging from the ashes of Germany's defeat in World War I, National Socialism developed from the radically anti-Semitic and nationalist ideas expounded by Adolf Hitler and the National Socialist German Workers' Party, quickly spreading throughout Germany due to the weakness of the Weimar Republic. Praised by its leaders and imposed on its citizens, this ideology proclaims Aryans as the superior race, relegating their enemies to the lowest rungs of society. Such decadent peoples are considered fit only for extermination or enslavement to make way for the "living space" of the dominant race. Totalitarian rule in such a state becomes the norm, and democracy is viewed as an evil equal to communism and liberalism. Class conflict is considered the preserve of "small nations," replaced by a corporatist "national community," which prioritizes the nation over any social class.
