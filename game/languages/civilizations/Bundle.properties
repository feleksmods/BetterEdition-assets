DConfederation = nationalism became the dominant force of the twentieth century, proving its superiority in countering such foreign structures as Yugoslavia and the USSR. In this regard, strengthening the nation against the internal threat becomes vital for any state. Ignoring this task can turn into a disaster, so that your country does not turn into another historical note, like Austria.The main goal of the national conservative is unity. And what better way to achieve this goal than to unite society around the greatest nation — our country? There should be no mercy for those who oppose our state; only unity should remain in it. National conservatism values traditions highly, considering them the foundation of a strong social fabric, but they can also be rejected if their compliance threatens to incite class conflicts. The economic policy of such states does not follow any one doctrine, borrowing elements from both corporatism, dirigism, and the free market, relying on the philosophy that most effectively contributes to the elimination of class differences-an outdated and elite concept that contradicts national unity.
