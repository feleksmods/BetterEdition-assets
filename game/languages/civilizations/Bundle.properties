ww2thecalmbeforethestorm = "Calm Before the Storm" 1935 with the events of WWI
worafrww1text = The world, hardened by the fire and blood of World War I, lay in smoldering ruins by the end of 1918. The four great empires—Russia, Germany, Austria-Hungary, and the Ottoman Empire—collapsed, leaving behind a power vacuum, bitter ethnic conflicts, and deep social trauma. The Treaty of Versailles, intended to ensure a "peace for all time," proved to be a fragile twenty-year truce, setting the stage for new and even more devastating conflicts. Humiliated and exhausted, Germany, having lost significant territories and been forced to pay exorbitant reparations, harbored a deep, poisonous resentment that was waiting in the wings.
worafrww1 = The World After World War I
nazgeryadbomb = The German nuclear bomb!
nazgeryadbombtext = Our great German scientists have managed to create one of the first weapons of mass destruction! All that remains is to test it...
nazgeryadbombtext2 = Das ist gut, gut!
mesdymorieeez1 = The Legacy of Marshal and the Intermarium Doctrine
mesdymorietext11 = Six months have passed since the death of Józef Piłsudski. His vision of a great federation of nations between the Baltic, Black, and Adriatic Seas seemed like a utopia, but now, in the shadow of the growing German and Soviet threats, the idea is gaining new life. Edward Rydz-Śmigły and other sanation leaders are gathering in Warsaw to decide whether the "Intermarium" will become an official state doctrine. This will require enormous diplomatic resources, but it could save Eastern Europe from a new enslavement.
mesdymorietext21 = Pilsudski was right. We will revive the Intermarium!
referengumforplayer = Referendum
ispcomunwin = Republican Victory in Spain
ispcomunwintext1 = The Francoists are surrendering to the Republicans, as it no longer makes sense for them to resist the Republican government.
datsnorwoperger = Operation Weserübung
datsnorwopergerext = We have launched an invasion of Denmark and Norway to outmaneuver the British and secure naval and air bases. The Danes capitulated within hours, but the Allies are putting up a stubborn resistance in Norway. We must hold Narvik and Oslo at all costs, or our northern flank will be left exposed to the British fleet.
pariscrahger1 = The Fall of Paris
pariscrahger1text = German troops are entering Paris. The city has been declared open to avoid destruction. Our soldiers are marching along the Champs-Élysées, and the swastika flag is flying from the Eiffel Tower. The age-old feud with France has ended in a triumphant revenge for Versailles. But the war is not over, and the British are determined to fight on.
pariscrahger1text1 = Immediately begin pursuing the retreating French armies to the south.
franccap = Armistice of Compiègne
franccaptext = In the same train where Germany signed its surrender in 1918, France is asking for peace. The Führer is personally observing the ceremony. We will divide the country into an occupied zone and a Vichy regime. This is the greatest moment of our lives, but we must decide how to deal with the defeated enemy.
franccaptext1 = Establish close cooperation with the Vichy government.
remreingereveryone = Germany's remilitarization of the Rhineland!
remreingereveryonetext = Adolf Hitler led some of his troops into the Rhineland, where French troops were stationed under the terms of the Treaty of Versailles. The German troops easily crossed the region, crossed the Rhine, and eventually reached the French border.
obyedruszaomsk = The Black League continues its march
obyedruszaomsktext = In less than half a century, Russia has fallen twice to the German invaders. But today, as Dmitry Timofeyevich Yazov delivered his speech in Omsk to a crowd of thousands, the soldiers' chants carried a message from the entire Russian people: "It will never happen again." Yazov has come a long and arduous journey to fully unite Russia, and now millions of Russians are cheering him as the Supreme Commander-in-Chief.
obyedruszaomsktext2 = The lights are going out across Eurasia.
