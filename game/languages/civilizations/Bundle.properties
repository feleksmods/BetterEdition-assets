dexhgr4_z = The Great German Reich — the heart of what is commonly called the "German Reich". Many possessions in Europe are considered to be an integral part of the country, although they are their own controlled self—governments - Reichskommissariats.
dsonego1_ml = The USSR was formed after the Civil War (1917-1922) under a 1922 Treaty. Soviet republics were not established in Finland, Poland, the Baltic States and other parts of the former Russian Empire. The Constitutions of the USSR were adopted in 1924, 1936 and 1977. Formally, the government was based on the system of councils of people's deputies, but in fact it was controlled by the Communist Party and the nomenklatura. The state was declared to be federal, but legal scholars consider it to be unitary or a pseudo-federation.
